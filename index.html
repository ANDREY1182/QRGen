<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 QR Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #0a0e17;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #141b2b;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            border: 1px solid #2a3a5c;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        h1 {
            color: #00d4ff;
            font-size: 22px;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0,212,255,0.2);
        }
        .subtitle {
            color: #7a8aa8;
            text-align: center;
            font-size: 13px;
            margin-bottom: 25px;
            border-bottom: 1px solid #1f2d47;
            padding-bottom: 15px;
        }
        .status-box {
            background: #0d1422;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #1f2d47;
        }
        .status-label {
            color: #7a8aa8;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-value {
            color: #00d4ff;
            font-size: 20px;
            font-weight: bold;
            margin-top: 5px;
            word-break: break-all;
            font-family: 'Courier New', monospace;
        }
        .qr-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            background: white;
            padding: 20px;
            border-radius: 12px;
        }
        #qrcode canvas {
            display: block !important;
            width: 200px !important;
            height: 200px !important;
        }
        .info {
            color: #7a8aa8;
            font-size: 13px;
            text-align: center;
            margin: 15px 0;
            padding: 10px;
            background: #0d1422;
            border-radius: 8px;
            border: 1px solid #1a2740;
        }
        .log {
            background: #0a0e17;
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 15px;
            font-size: 12px;
            color: #4a6a8a;
            border: 1px solid #1a2740;
            max-height: 120px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
        }
        .log .success { color: #48bb78; }
        .log .error { color: #fc8181; }
        .log .info-log { color: #63b3ed; }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #1a2a4a;
            color: #00d4ff;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid #2a4a7a;
            font-size: 13px;
            transition: all 0.3s;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        .btn:hover {
            background: #2a3a6a;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0,212,255,0.1);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .auto-download-badge {
            display: inline-block;
            background: #1a3a2a;
            color: #48bb78;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            border: 1px solid #2a5a3a;
            margin-top: 10px;
        }
        @media (max-width: 480px) {
            .container { padding: 24px 16px; }
            #qrcode canvas { width: 160px !important; height: 160px !important; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="container">
    <h1>⚡ ESP32 QR GENERATOR</h1>
    <div class="subtitle">автоматический бинарный ответ для ESP32</div>

    <div class="status-box">
        <div class="status-label">► Текущий IP</div>
        <div class="status-value" id="ipDisplay">—</div>
    </div>

    <div class="qr-container">
        <div id="qrcode"></div>
    </div>

    <div class="info" id="statusInfo">
        ⏳ Ожидание GET-запроса с ?ip=
    </div>

    <div class="log" id="logContainer">
        <div class="info-log">[SYSTEM] Готов к приему запросов</div>
    </div>

    <div class="btn-group">
        <a href="#" id="downloadRawBtn" class="btn">⬇ Скачать RAW (ESP32)</a>
        <a href="#" id="downloadPngBtn" class="btn">⬇ Скачать PNG</a>
    </div>

    <div style="text-align: center; margin-top: 12px;">
        <span class="auto-download-badge">✅ Автоответ: бинарный RAW</span>
    </div>
</div>

<script>
    (function() {
        // DOM элементы
        const qrContainer = document.getElementById('qrcode');
        const ipDisplay = document.getElementById('ipDisplay');
        const statusInfo = document.getElementById('statusInfo');
        const logContainer = document.getElementById('logContainer');
        const downloadRawBtn = document.getElementById('downloadRawBtn');
        const downloadPngBtn = document.getElementById('downloadPngBtn');

        let currentIP = '';
        let currentCanvas = null;
        let currentRawData = null;

        // Логирование
        function addLog(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            const time = new Date().toLocaleTimeString();
            div.textContent = `[${time}] ${msg}`;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
            // Ограничиваем количество логов
            while (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.firstChild);
            }
        }

        // Очистка QR
        function clearQR() {
            qrContainer.innerHTML = '';
            currentCanvas = null;
            currentRawData = null;
            downloadRawBtn.style.opacity = '0.5';
            downloadRawBtn.style.pointerEvents = 'none';
            downloadRawBtn.href = '#';
            downloadPngBtn.style.opacity = '0.5';
            downloadPngBtn.style.pointerEvents = 'none';
            downloadPngBtn.href = '#';
        }

        // Генерация QR
        function generateQR(ip) {
            clearQR();

            if (!ip || ip.trim() === '') {
                ipDisplay.textContent = '—';
                statusInfo.textContent = '❌ IP не указан';
                addLog('Ошибка: IP не указан', 'error');
                return;
            }

            const sanitized = ip.trim();
            currentIP = sanitized;
            ipDisplay.textContent = sanitized;
            statusInfo.textContent = `✅ QR сгенерирован для ${sanitized}`;
            addLog(`QR-код сгенерирован для IP: ${sanitized}`, 'success');

            try {
                // Генерируем монохромный QR
                const qr = new QRCode(qrContainer, {
                    text: sanitized,
                    width: 200,
                    height: 200,
                    colorDark: '#000000',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });

                setTimeout(() => {
                    const canvas = qrContainer.querySelector('canvas');
                    if (canvas) {
                        currentCanvas = canvas;

                        // Активируем кнопку PNG
                        downloadPngBtn.style.opacity = '1';
                        downloadPngBtn.style.pointerEvents = 'auto';
                        const pngData = canvas.toDataURL('image/png');
                        downloadPngBtn.href = pngData;
                        downloadPngBtn.download = `qr_${sanitized}.png`;

                        // Генерируем RAW для ESP32
                        generateRawData(canvas, sanitized);

                        // АВТОМАТИЧЕСКИЙ ОТВЕТ ДЛЯ ESP32
                        // Если страница открыта с ?ip=, то автоматически отдаем RAW
                        autoSendResponse();

                    } else {
                        addLog('Ошибка: canvas не найден', 'error');
                    }
                }, 200);

            } catch (e) {
                console.error(e);
                addLog(`Ошибка генерации QR: ${e.message}`, 'error');
                statusInfo.textContent = '❌ Ошибка генерации';
            }
        }

        // Генерация бинарного RAW для ESP32 (128x64 монохромный)
        function generateRawData(canvas, ip) {
            try {
                const width = 128;
                const height = 64;
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = width;
                tempCanvas.height = height;

                // Рисуем QR с масштабированием
                tempCtx.drawImage(canvas, 0, 0, width, height);

                // Получаем пиксели
                const imageData = tempCtx.getImageData(0, 0, width, height);
                const data = imageData.data;

                // Создаем бинарный массив (1 бит на пиксель)
                // 1 = черный (включен), 0 = белый (выключен)
                const binaryData = [];
                for (let i = 0; i < data.length; i += 4) {
                    // Берем яркость (все каналы одинаковы для ЧБ)
                    const pixel = data[i] < 128 ? 1 : 0;
                    binaryData.push(pixel);
                }

                // Упаковываем биты в байты (MSB first)
                const byteArray = [];
                for (let i = 0; i < binaryData.length; i += 8) {
                    let byte = 0;
                    for (let j = 0; j < 8; j++) {
                        if (i + j < binaryData.length) {
                            byte = (byte << 1) | binaryData[i + j];
                        }
                    }
                    byteArray.push(byte);
                }

                currentRawData = new Uint8Array(byteArray);

                // Активируем кнопку RAW
                downloadRawBtn.style.opacity = '1';
                downloadRawBtn.style.pointerEvents = 'auto';
                const blob = new Blob([currentRawData], {
                    type: 'application/octet-stream'
                });
                const url = URL.createObjectURL(blob);
                downloadRawBtn.href = url;
                downloadRawBtn.download = `qr_${ip}_128x64.raw`;

                addLog(`RAW-данные готовы: ${currentRawData.length} байт`, 'success');

            } catch (e) {
                console.warn('Ошибка генерации RAW:', e);
                addLog(`Ошибка RAW: ${e.message}`, 'error');
            }
        }

        // АВТОМАТИЧЕСКАЯ ОТДАЧА RAW ДЛЯ ESP32
        function autoSendResponse() {
            // Проверяем, есть ли IP в URL
            const params = new URLSearchParams(window.location.search);
            const ip = params.get('ip');

            if (ip && currentRawData) {
                addLog(`📡 Автоответ для ESP32: отправка RAW (${currentRawData.length} байт)`, 'info-log');

                // Создаем ссылку для скачивания
                const blob = new Blob([currentRawData], {
                    type: 'application/octet-stream'
                });
                const url = URL.createObjectURL(blob);

                // Создаем невидимую ссылку и кликаем для автоматической загрузки
                const link = document.createElement('a');
                link.href = url;
                link.download = `qr_${ip}_128x64.raw`;
                link.style.display = 'none';
                document.body.appendChild(link);

                // Задержка для уверенности, что все прогрузилось
                setTimeout(() => {
                    link.click();
                    document.body.removeChild(link);
                    addLog(`✅ RAW отправлен ESP32 (автозагрузка)`, 'success');
                    statusInfo.textContent = `📤 RAW отправлен для ${ip}`;

                    // Через 3 секунды освобождаем URL
                    setTimeout(() => {
                        URL.revokeObjectURL(url);
                    }, 3000);
                }, 500);

                return true;
            }

            // Если IP есть, но RAW еще не готов — ждем
            if (ip && !currentRawData) {
                addLog(`⏳ Ожидание генерации RAW для ${ip}...`, 'info-log');
                // Проверим через интервал
                const checkInterval = setInterval(() => {
                    if (currentRawData) {
                        clearInterval(checkInterval);
                        autoSendResponse();
                    }
                }, 200);

                // Таймаут на 5 секунд
                setTimeout(() => {
                    clearInterval(checkInterval);
                    if (!currentRawData) {
                        addLog('⚠️ Таймаут: RAW не сгенерирован', 'error');
                    }
                }, 5000);
                return true;
            }

            return false;
        }

        // Получить IP из URL и сгенерировать
        function processURL() {
            const params = new URLSearchParams(window.location.search);
            const ip = params.get('ip');

            if (ip && ip.trim() !== '') {
                addLog(`📥 Получен запрос с IP: ${ip}`, 'info-log');
                ipDisplay.textContent = ip.trim();
                generateQR(ip.trim());
                return true;
            }

            // Если IP не передан, показываем демо
            addLog('ℹ️ Ожидается GET-запрос с ?ip=адрес', 'info-log');
            statusInfo.textContent = '📡 Отправьте GET с ?ip=ваш_IP';
            return false;
        }

        // Инициализация
        window.addEventListener('DOMContentLoaded', function() {
            // Добавляем обработчик для ручной генерации (для тестирования)
            // Можно добавить через консоль: generateQR('192.168.1.100')

            // Обработка URL при загрузке
            processURL();

            // Следим за изменением URL (для навигации)
            window.addEventListener('popstate', function() {
                processURL();
            });

            // Если страница загружена и в URL нет IP, но есть реферал - пробуем
            // Это для случаев, когда ESP32 отправляет запрос
            addLog('🔄 Система готова', 'info-log');
        });

        // Экспортируем функции для тестирования из консоли
        window.generateQR = generateQR;
        window.testIP = function(ip) {
            const url = new URL(window.location);
            url.searchParams.set('ip', ip);
            window.history.pushState({}, '', url);
            processURL();
        };

        console.log('ℹ️ Для теста в консоли: testIP("192.168.1.100")');
    })();
</script>
</body>
</html>
