<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 QR Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #0a0e17;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #141b2b;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            border: 1px solid #2a3a5c;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        h1 {
            color: #00d4ff;
            font-size: 22px;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0,212,255,0.2);
        }
        .subtitle {
            color: #7a8aa8;
            text-align: center;
            font-size: 13px;
            margin-bottom: 25px;
            border-bottom: 1px solid #1f2d47;
            padding-bottom: 15px;
        }
        .status-box {
            background: #0d1422;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #1f2d47;
        }
        .status-label {
            color: #7a8aa8;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-value {
            color: #00d4ff;
            font-size: 20px;
            font-weight: bold;
            margin-top: 5px;
            word-break: break-all;
            font-family: 'Courier New', monospace;
        }
        .qr-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            background: white;
            padding: 20px;
            border-radius: 12px;
        }
        #qrcode {
            display: inline-block;
        }
        #qrcode canvas {
            display: block !important;
            width: 200px !important;
            height: 200px !important;
        }
        .info {
            color: #7a8aa8;
            font-size: 13px;
            text-align: center;
            margin: 15px 0;
            padding: 10px;
            background: #0d1422;
            border-radius: 8px;
            border: 1px solid #1a2740;
        }
        .log {
            background: #0a0e17;
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 15px;
            font-size: 12px;
            color: #4a6a8a;
            border: 1px solid #1a2740;
            max-height: 120px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
        }
        .log .success { color: #48bb78; }
        .log .error { color: #fc8181; }
        .log .info-log { color: #63b3ed; }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #1a2a4a;
            color: #00d4ff;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid #2a4a7a;
            font-size: 13px;
            transition: all 0.3s;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        .btn:hover {
            background: #2a3a6a;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0,212,255,0.1);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .auto-download-badge {
            display: inline-block;
            background: #1a3a2a;
            color: #48bb78;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            border: 1px solid #2a5a3a;
            margin-top: 10px;
        }
        .hidden { display: none !important; }
        .qr-text {
            color: #63b3ed;
            font-size: 12px;
            text-align: center;
            margin: 10px 0;
            padding: 8px;
            background: #0d1422;
            border-radius: 6px;
            border: 1px solid #1a2740;
            word-break: break-all;
        }
        @media (max-width: 480px) {
            .container { padding: 24px 16px; }
            #qrcode canvas { width: 160px !important; height: 160px !important; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⚡ ESP32 QR GENERATOR</h1>
    <div class="subtitle">автоматический бинарный ответ для ESP32</div>

    <div class="status-box">
        <div class="status-label">► Текущий IP</div>
        <div class="status-value" id="ipDisplay">—</div>
    </div>

    <div class="qr-text" id="qrText">QR содержит: —</div>

    <div class="qr-container">
        <div id="qrcode"></div>
    </div>

    <div class="info" id="statusInfo">
        ⏳ Ожидание GET-запроса с ?ip=
    </div>

    <div class="log" id="logContainer">
        <div class="info-log">[SYSTEM] Готов к приему запросов</div>
    </div>

    <div class="btn-group">
        <a href="#" id="downloadRawBtn" class="btn">⬇ Скачать RAW (ESP32)</a>
        <a href="#" id="downloadPngBtn" class="btn">⬇ Скачать PNG</a>
    </div>

    <div style="text-align: center; margin-top: 12px;">
        <span class="auto-download-badge">✅ Автоответ: бинарный RAW</span>
    </div>
</div>

<script>
    (function() {
        // DOM элементы
        const qrContainer = document.getElementById('qrcode');
        const ipDisplay = document.getElementById('ipDisplay');
        const qrText = document.getElementById('qrText');
        const statusInfo = document.getElementById('statusInfo');
        const logContainer = document.getElementById('logContainer');
        const downloadRawBtn = document.getElementById('downloadRawBtn');
        const downloadPngBtn = document.getElementById('downloadPngBtn');

        let currentIP = '';
        let currentQRInstance = null;
        let currentRawData = null;
        let currentQRData = '';

        // Логирование
        function addLog(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            const time = new Date().toLocaleTimeString();
            div.textContent = `[${time}] ${msg}`;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
            while (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.firstChild);
            }
        }

        // Полное очищение QR
        function clearQR() {
            qrContainer.innerHTML = '';
            currentQRInstance = null;
            currentRawData = null;
            currentQRData = '';
            
            downloadRawBtn.style.opacity = '0.5';
            downloadRawBtn.style.pointerEvents = 'none';
            downloadRawBtn.href = '#';
            downloadPngBtn.style.opacity = '0.5';
            downloadPngBtn.style.pointerEvents = 'none';
            downloadPngBtn.href = '#';
            
            qrText.textContent = 'QR содержит: —';
        }

        // Конвертация canvas в монохромный RAW 128x64
        function convertToRaw(canvas) {
            try {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = 128;
                tempCanvas.height = 64;
                const tempCtx = tempCanvas.getContext('2d');
                
                tempCtx.fillStyle = '#FFFFFF';
                tempCtx.fillRect(0, 0, 128, 64);
                tempCtx.drawImage(canvas, 0, 0, 128, 64);
                
                const imageData = tempCtx.getImageData(0, 0, 128, 64);
                const data = imageData.data;
                
                const bitArray = new Uint8Array(1024);
                
                for (let y = 0; y < 64; y++) {
                    for (let x = 0; x < 128; x++) {
                        const pixelIndex = (y * 128 + x) * 4;
                        const brightness = data[pixelIndex];
                        const bit = (brightness < 128) ? 1 : 0;
                        
                        const byteIndex = y * 16 + Math.floor(x / 8);
                        const bitPosition = 7 - (x % 8);
                        
                        if (bit === 1) {
                            bitArray[byteIndex] |= (1 << bitPosition);
                        } else {
                            bitArray[byteIndex] &= ~(1 << bitPosition);
                        }
                    }
                }
                
                return bitArray;
                
            } catch (e) {
                console.error('Ошибка конвертации в RAW:', e);
                return null;
            }
        }

        // Генерация QR
        function generateQR(ip) {
            clearQR();
            
            if (!ip || ip.trim() === '') {
                ipDisplay.textContent = '—';
                statusInfo.textContent = '❌ IP не указан';
                addLog('Ошибка: IP не указан', 'error');
                return;
            }

            const sanitized = ip.trim();
            
            // ФОРМИРУЕМ ПОЛНУЮ ССЫЛКУ С HTTP://
            // Проверяем, не содержит ли уже http:// или https://
            let fullUrl = sanitized;
            if (!fullUrl.startsWith('http://') && !fullUrl.startsWith('https://')) {
                fullUrl = 'http://' + fullUrl;
            }
            
            currentIP = sanitized;
            currentQRData = fullUrl;
            
            ipDisplay.textContent = sanitized;
            qrText.textContent = `QR содержит: ${fullUrl}`;
            statusInfo.textContent = `✅ Генерация QR для ${fullUrl}`;
            addLog(`Генерация QR для: ${fullUrl}`, 'info-log');

            try {
                // Генерируем QR с полной ссылкой
                currentQRInstance = new QRCode(qrContainer, {
                    text: fullUrl,  // <-- ЗДЕСЬ ПОДСТАВЛЯЕТСЯ HTTP://
                    width: 200,
                    height: 200,
                    colorDark: '#000000',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });

                setTimeout(() => {
                    const canvas = qrContainer.querySelector('canvas');
                    
                    if (canvas) {
                        const rawData = convertToRaw(canvas);
                        
                        if (rawData) {
                            currentRawData = rawData;
                            
                            downloadPngBtn.style.opacity = '1';
                            downloadPngBtn.style.pointerEvents = 'auto';
                            const pngData = canvas.toDataURL('image/png');
                            downloadPngBtn.href = pngData;
                            downloadPngBtn.download = `qr_${sanitized}.png`;
                            
                            downloadRawBtn.style.opacity = '1';
                            downloadRawBtn.style.pointerEvents = 'auto';
                            const blob = new Blob([rawData], {
                                type: 'application/octet-stream'
                            });
                            const url = URL.createObjectURL(blob);
                            downloadRawBtn.href = url;
                            downloadRawBtn.download = `qr_${sanitized}_128x64.raw`;
                            
                            statusInfo.textContent = `✅ QR готов для ${fullUrl}`;
                            addLog(`✅ RAW сгенерирован: ${rawData.length} байт`, 'success');
                            
                            autoSendResponse();
                            
                        } else {
                            addLog('❌ Ошибка конвертации в RAW', 'error');
                            statusInfo.textContent = '❌ Ошибка конвертации';
                        }
                    } else {
                        addLog('❌ Canvas не найден', 'error');
                        statusInfo.textContent = '❌ Ошибка рендеринга';
                    }
                }, 300);
                
            } catch (e) {
                console.error(e);
                addLog(`❌ Ошибка: ${e.message}`, 'error');
                statusInfo.textContent = '❌ Ошибка генерации';
                clearQR();
            }
        }

        // Автоматическая отправка RAW для ESP32
        function autoSendResponse() {
            const params = new URLSearchParams(window.location.search);
            const ip = params.get('ip');
            
            if (ip && currentRawData) {
                addLog(`📡 Автоответ для ESP32: отправка RAW (${currentRawData.length} байт)`, 'info-log');
                
                const blob = new Blob([currentRawData], {
                    type: 'application/octet-stream'
                });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = url;
                link.download = `qr_${ip}_128x64.raw`;
                link.style.display = 'none';
                document.body.appendChild(link);
                
                setTimeout(() => {
                    link.click();
                    document.body.removeChild(link);
                    addLog(`✅ RAW отправлен ESP32`, 'success');
                    statusInfo.textContent = `📤 RAW отправлен для ${ip}`;
                    
                    setTimeout(() => {
                        URL.revokeObjectURL(url);
                    }, 3000);
                }, 500);
                
                return true;
            }
            
            return false;
        }

        // Обработка URL параметров
        function processURL() {
            const params = new URLSearchParams(window.location.search);
            const ip = params.get('ip');
            
            if (ip && ip.trim() !== '') {
                addLog(`📥 Получен запрос с IP: ${ip}`, 'info-log');
                generateQR(ip.trim());
                return true;
            }
            
            addLog('ℹ️ Ожидается GET-запрос с ?ip=адрес', 'info-log');
            statusInfo.textContent = '📡 Отправьте GET с ?ip=ваш_IP';
            return false;
        }

        // Инициализация
        window.addEventListener('DOMContentLoaded', function() {
            processURL();
            
            window.addEventListener('popstate', function() {
                clearQR();
                processURL();
            });
        });

        // Экспорт для тестирования
        window.generateQR = generateQR;
        window.testIP = function(ip) {
            const url = new URL(window.location);
            url.searchParams.set('ip', ip);
            window.history.pushState({}, '', url);
            clearQR();
            processURL();
        };
        window.clearQR = clearQR;

        console.log('ℹ️ QR будет содержать: http://[IP]');
        console.log('ℹ️ Для теста: testIP("192.168.1.100")');
    })();
</script>
</body>
</html>
